[package]
name = "jpeg-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
jpeg = { path = "../.." }

# Not part of the root package: only this crate may depend on libfuzzer-sys.
