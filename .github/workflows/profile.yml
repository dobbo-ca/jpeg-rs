name: profile
# Dev tool, not a check: the bench example under callgrind for each line of tests/parity/profile.txt.
# Runs on dispatch, and on a pull request that changes tests/parity/profile.txt.
on:
  workflow_dispatch: {}
  pull_request: { paths: ['tests/parity/profile.txt'] }
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false, persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: profile
          load: true
          push: false
          cache-from: type=gha,scope=jpeg-rs-profile
          # Only main and dispatch runs export: a PR's cache is scoped to its ref, so no other PR
          # could read it, and the export takes about two minutes.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=jpeg-rs-profile' || '' }}
          secrets: gh_token=${{ github.token }}
          tags: jpeg-profile:local
      - run: docker run --rm jpeg-profile:local sh -c 'sh tests/parity/profile.sh $(cat tests/parity/profile.txt)'
