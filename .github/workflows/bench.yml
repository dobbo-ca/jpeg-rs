name: bench
on: { workflow_dispatch: {}, push: { branches: [main] } }
permissions:
  contents: read
# A new run waits for the one before it; it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Not a required check. The Go and Rust decode and encode of the fixtures run in one container,
  # so the ratio compares the same machine.
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false, persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: bench
          load: true
          push: false
          cache-from: type=gha,scope=jpeg-rs-bench
          cache-to: type=gha,mode=max,scope=jpeg-rs-bench
          secrets: gh_token=${{ github.token }}
          tags: jpeg-bench:local
      # docker run, not a RUN layer: a BuildKit cache hit would skip the timing.
      - run: |
          { echo '### Decode and encode time of the fixtures, ms per MB of output (lower is better); default build and x86-64-v4 build'; echo
            docker run --rm jpeg-bench:local sh tests/parity/bench.sh; } | tee -a "$GITHUB_STEP_SUMMARY"
