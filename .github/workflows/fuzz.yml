name: fuzz
on:
  schedule: [{ cron: '23 18 * * 1' }]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Seconds per target
        default: '600'
permissions:
  contents: read
# A new run waits for the one before it; it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Every target on x86_64 (ubuntu-24.04), and the NEON kernels' simd_* targets on native aarch64
  # (ubuntu-24.04-arm), with ASan.
  fuzz:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # `scalar` (JPEG_SIMD=scalar) fuzzes the scalar kernels inside the whole decode and encode,
        # which the AVX2 build hides on this runner. The simd_* targets compare each tier with
        # scalar themselves.
        include:
          - { arch: x64, target: decode, simd: default }
          - { arch: x64, target: decoder_reuse, simd: default }
          - { arch: x64, target: decode_config, simd: default }
          - { arch: x64, target: tables, simd: default }
          - { arch: x64, target: coefficients, simd: default }
          - { arch: x64, target: row_reader, simd: default }
          - { arch: x64, target: pyramid, simd: default }
          - { arch: x64, target: encode, simd: default }
          - { arch: x64, target: encoder_reuse, simd: default }
          - { arch: x64, target: ledger, simd: default }
          - { arch: x64, target: kernels, simd: default }
          - { arch: x64, target: simd_idct8, simd: default }
          - { arch: x64, target: simd_idct4, simd: default }
          - { arch: x64, target: simd_color, simd: default }
          - { arch: x64, target: simd_h2v1, simd: default }
          - { arch: x64, target: simd_h2v2, simd: default }
          - { arch: x64, target: simd_fdct, simd: default }
          - { arch: x64, target: simd_rgb2ycc, simd: default }
          - { arch: x64, target: simd_downsample, simd: default }
          - { arch: x64, target: simd_huff, simd: default }
          - { arch: x64, target: decode, simd: scalar }
          - { arch: x64, target: decoder_reuse, simd: scalar }
          - { arch: x64, target: row_reader, simd: scalar }
          - { arch: x64, target: pyramid, simd: scalar }
          - { arch: x64, target: encode, simd: scalar }
          - { arch: x64, target: encoder_reuse, simd: scalar }
          - { arch: arm64, target: simd_idct8, simd: default }
          - { arch: arm64, target: simd_idct4, simd: default }
          - { arch: arm64, target: simd_color, simd: default }
          - { arch: arm64, target: simd_h2v1, simd: default }
          - { arch: arm64, target: simd_h2v2, simd: default }
          - { arch: arm64, target: simd_fdct, simd: default }
          - { arch: arm64, target: simd_rgb2ycc, simd: default }
          - { arch: arm64, target: simd_downsample, simd: default }
    timeout-minutes: 60
    env:
      MAX_TOTAL_TIME: ${{ inputs.max_total_time || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false, persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: fuzz
          load: true
          push: false
          cache-from: type=gha,scope=jpeg-rs-fuzz-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=jpeg-rs-fuzz-${{ matrix.arch }}
          secrets: gh_token=${{ github.token }}
          tags: jpeg-fuzz:local
      # The corpus is kept between runs: restored here, copied into the container, copied back
      # out and saved, so a run goes on from where the last one stopped. One cache per
      # architecture, target and SIMD mode; the newest is restored.
      - id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.simd }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.simd }}-
      # docker create + start, not a RUN layer: a BuildKit cache hit would skip the fuzzing.
      # Seeds: the jpeg-go fuzz seeds (tests/fuzz/seeds/<target>) and the fixtures (/seeds/<target>, made
      # in the image); new inputs go to the first corpus dir. -malloc_limit_mb is the backstop; the
      # targets also run under small Limits.
      - run: |
          mkdir -p corpus/${{ matrix.target }}
          docker create --name fuzz -e MAX_TOTAL_TIME -e TARGET=${{ matrix.target }} -e JPEG_SIMD=${{ matrix.simd == 'scalar' && 'scalar' || 'auto' }} jpeg-fuzz:local \
            sh -c 'seeds=; for d in tests/fuzz/seeds/$TARGET /seeds/$TARGET; do [ -d $d ] && seeds="$seeds $d"; done; cargo +nightly fuzz run --fuzz-dir tests/fuzz $TARGET tests/fuzz/corpus/$TARGET $seeds -- -max_total_time=$MAX_TOTAL_TIME -max_len=65536 -timeout=60 -rss_limit_mb=2048 -malloc_limit_mb=512'
          docker cp corpus fuzz:/src/tests/fuzz/
          docker start -a fuzz
      - if: failure()
        run: docker cp fuzz:/src/tests/fuzz/artifacts/${{ matrix.target }} ./crashers
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.simd }}
          path: crashers
      - if: always()
        run: docker cp fuzz:/src/tests/fuzz/corpus/${{ matrix.target }}/. corpus/${{ matrix.target }}/ || true
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.simd }}-${{ github.run_id }}
